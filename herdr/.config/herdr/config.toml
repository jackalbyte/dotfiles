onboarding = false

[theme]
name = "vesper"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
tab_bar_position = "top"
prompt_new_tab_name = false
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false

agent_panel_sort = "spaces"
status_indicators = "symbols"
[experimental]
pane_history = false

[keys]
prefix = "ctrl+b"

# Workspaces: nearest equivalent to tmux sessions
workspace_picker = "prefix+s"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"
rename_workspace = "prefix+$"
detach = "prefix+d"

# Tabs: tmux windows
goto = "prefix+w"
new_tab = "prefix+c"
rename_tab = "prefix+comma"
#previous_tab = "prefix+p"
#next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"

# Panes: tmux default split keys
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'
close_pane = "prefix+x"
zoom = "prefix+z"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

cycle_pane_next = "prefix+o"
last_pane = "prefix+semicolon"

resize_pane_left = "prefix+ctrl+left"
resize_pane_down = "prefix+ctrl+down"
resize_pane_up = "prefix+ctrl+up"
resize_pane_right = "prefix+ctrl+right"

help = "prefix+?"

# Herdr-specific actions, moved away from tmux keys
settings = "prefix+shift+comma"
open_notification_target = "prefix+shift+o"

